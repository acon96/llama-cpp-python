name: Build Release (custom)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path

          source = Path("llama_cpp/__init__.py").read_text()
          module = ast.parse(source)
          version = next(
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )

          suffix = "+homellm"
          if not version.endswith(suffix):
              raise SystemExit(
                  f"Expected __version__ to end with {suffix!r}, got {version!r}"
              )

          tag = version.removesuffix(suffix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag={tag}", file=output)
          print(f"Release tag: {tag} (wheel version: {version})")

      - name: Ensure release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          response_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")

          case "$status" in
            200)
              echo "::error::Release ${RELEASE_TAG} already exists. Delete that release and run this workflow again if you intend to rebuild it."
              exit 1
              ;;
            404)
              echo "Release ${RELEASE_TAG} does not exist; continuing."
              ;;
            *)
              echo "::error::Unable to check release ${RELEASE_TAG}; GitHub API returned HTTP ${status}."
              cat "$response_file"
              exit 1
              ;;
          esac

  build_wheels_x64:
    name: Build musllinux x86_64 wheel
    needs: prepare_release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          RUST_LOG=trace python -m uv pip install -e .[all] --verbose
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_REPAIR_WHEEL_COMMAND: "LD_LIBRARY_PATH=$PWD/llama_cpp/lib auditwheel repair -w {dest_dir} {wheel}"
          CIBW_MUSLLINUX_X86_64_IMAGE: "musllinux_1_2"
          # Build only musllinux wheels; wheel.py-api is py3, so one build
          # covers supported Python versions.
          CIBW_BUILD: "cp39-musllinux_*"
          CIBW_SKIP: "pp*"
          CIBW_ARCHS: "x86_64"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DGGML_NATIVE=off -DGGML_CUDA=off"
        with:
          package-dir: .
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-x86_64
          path: ./wheelhouse/*.whl

  build_wheels_arm64:
    name: Build musllinux arm64 wheel
    needs: prepare_release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_SKIP: "pp*"
          CIBW_REPAIR_WHEEL_COMMAND: "LD_LIBRARY_PATH=$PWD/llama_cpp/lib auditwheel repair -w {dest_dir} {wheel}"
          CIBW_ARCHS: "aarch64"
          CIBW_MUSLLINUX_AARCH64_IMAGE: "musllinux_1_2"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DGGML_NATIVE=off -DGGML_CUDA=off"
          # Build only musllinux wheels; wheel.py-api is py3, so one build
          # covers supported Python versions.
          CIBW_BUILD: "cp39-musllinux_*"
        with:
          output-dir: wheelhouse

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels_arm64
          path: ./wheelhouse/*.whl

  release:
    name: Release
    needs: [prepare_release, build_wheels_x64, build_wheels_arm64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Recheck that release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        shell: bash
        run: |
          response_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")

          case "$status" in
            200)
              echo "::error::Release ${RELEASE_TAG} already exists. Delete that release and run this workflow again if you intend to rebuild it."
              exit 1
              ;;
            404)
              ;;
            *)
              echo "::error::Unable to recheck release ${RELEASE_TAG}; GitHub API returned HTTP ${status}."
              cat "$response_file"
              exit 1
              ;;
          esac

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: ${{ needs.prepare_release.outputs.tag }}
          target_commitish: ${{ github.sha }}
